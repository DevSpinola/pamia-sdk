name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configurar Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      # Disponibiliza sdkmanager no PATH sem depender da imagem do runner.
      - name: Configurar ferramentas Android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Preparar Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Compilar biblioteca
        run: bash ./gradlew assembleRelease --no-daemon
